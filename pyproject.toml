[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["romansh_llm*"]

[project]
name = "romansh-llm"
version = "0.1.0"
description = "Dialect-aware language model for all six Romansh varieties, trained on ZurichNLP/quotidiana with QLoRA continued pretraining and optional instruction tuning."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Alexander Vassilev", email = "alex.is.busy.coding@gmail.com"}
]
keywords = [
    "romansh",
    "language-model",
    "nlp",
    "huggingface",
    "qlora",
    "dialect",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.36.0",
    "datasets>=2.14.0",
    "peft>=0.7.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.46.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "pre-commit>=3.6.0",
    "checkov>=3.0.0",
]
logging = [
    "wandb>=0.16.0",
]
aws = [
    "sagemaker[train]>=3.0.0",
    "boto3>=1.28.0",
    "awscli>=1.32.0",
]

[project.urls]
Homepage = "https://github.com/alex-is-busy-coding/Romansh-LLM"
Repository = "https://github.com/alex-is-busy-coding/Romansh-LLM"
Documentation = "https://github.com/alex-is-busy-coding/Romansh-LLM"

[project.scripts]
romansh-llm-pretrain = "romansh_llm.train.pretrain:main"

[tool.ruff.lint.per-file-ignores]
"scripts/launch_sagemaker_job.py" = ["E402"]
"src/romansh_llm/train/pretrain.py" = ["E402"]
