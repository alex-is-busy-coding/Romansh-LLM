# Romansh-LLM: shared config. 
# Env-specific files (dev.yaml, prod.yaml) override these.

model:
  name_or_path: "meta-llama/Llama-3.2-3B"

paths:
  data_dir: "data"
  output_dir: "output/cpt"
  run_name: "rhaeto-llm-cpt"

data:
  dataset_name: "ZurichNLP/quotidiana"
  subsets:
    - "1997_2008"
    - "2021_2025"
  max_length: 1024
  val_ratio: 0.02

dialect_tags:
  use_dialect_tags: true
  dialect_tag_format: "[{variety}]\n\n"

qlora:
  lora_r: 64
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: "q_proj,v_proj,k_proj,o_proj"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"

training:
  num_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  bf16: true
  fp16: false
  report_to: "none"
